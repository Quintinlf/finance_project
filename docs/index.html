<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Desk</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trading Desk">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --bg:#0b0e14; --panel:#131824; --panel-2:#1a2030; --line:#242c3d;
    --text:#e6ebf5; --muted:#8b95a9; --dim:#5d677d;
    --up:#26a69a; --down:#ef5350; --warn:#f5a524; --accent:#4c8dff;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 40px env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:20px 16px}

  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:18px}
  h1{font-size:20px;margin:0;letter-spacing:-.01em;font-weight:650}
  .stamp{color:var(--dim);font-size:12px;font-family:var(--mono);margin-left:auto}

  /* ---- alert banner: the panel that would have caught the March deadlock ---- */
  .alert{
    display:flex;gap:12px;align-items:flex-start;
    background:rgba(245,165,36,.08);border:1px solid rgba(245,165,36,.3);
    border-left:3px solid var(--warn);border-radius:8px;padding:14px 16px;margin-bottom:18px;
  }
  .alert.crit{background:rgba(239,83,80,.08);border-color:rgba(239,83,80,.32);border-left-color:var(--down)}
  .alert h3{margin:0 0 4px;font-size:14px;font-weight:650}
  .alert p{margin:0;color:var(--muted);font-size:13px}
  .alert code{font-family:var(--mono);font-size:12px;color:var(--text);background:rgba(255,255,255,.05);padding:1px 5px;border-radius:3px}

  /* ---- stat tiles ---- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
  .stat .v{font-size:22px;font-weight:640;font-family:var(--mono);letter-spacing:-.02em}
  .stat .sub{font-size:11px;color:var(--dim);margin-top:3px;font-family:var(--mono)}
  .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .muted{color:var(--muted)}

  /* exposure gauge — the constraint that silently stopped this bot */
  .gauge{height:4px;background:var(--panel-2);border-radius:2px;margin-top:8px;overflow:hidden;position:relative}
  .gauge i{display:block;height:100%;border-radius:2px;background:var(--up)}
  .gauge i.over{background:var(--down)}
  .gauge .cap{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--text);opacity:.5}

  section{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
  section > h2{
    margin:0;padding:13px 16px;font-size:13px;font-weight:640;
    border-bottom:1px solid var(--line);letter-spacing:.02em;
    display:flex;align-items:center;gap:8px;
  }
  section > h2 .note{margin-left:auto;color:var(--dim);font-weight:400;font-size:11px;font-family:var(--mono)}
  .body{padding:14px 16px}
  #equity{height:280px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{
    text-align:left;color:var(--muted);font-weight:550;font-size:11px;
    text-transform:uppercase;letter-spacing:.05em;padding:9px 16px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);
  }
  td{padding:9px 16px;border-bottom:1px solid rgba(36,44,61,.5);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  td.num{text-align:right;font-family:var(--mono)}
  .scroll{max-height:400px;overflow-y:auto;overflow-x:auto}
  .sym{font-family:var(--mono);font-weight:600}

  .tag{
    display:inline-block;padding:1.5px 7px;border-radius:4px;font-size:11px;
    font-weight:600;font-family:var(--mono);letter-spacing:.02em;
  }
  .t-buy{background:rgba(38,166,154,.15);color:var(--up)}
  .t-sell{background:rgba(239,83,80,.15);color:var(--down)}
  .t-hold{background:rgba(139,149,169,.12);color:var(--muted)}
  .t-pass{background:rgba(76,141,255,.15);color:var(--accent)}
  .t-reject,.t-failed{background:rgba(239,83,80,.15);color:var(--down)}
  .t-open{background:rgba(245,165,36,.15);color:var(--warn)}
  .t-closed{background:rgba(139,149,169,.12);color:var(--muted)}

  .bar{display:inline-block;height:3px;background:var(--accent);border-radius:2px;vertical-align:middle;margin-left:6px;opacity:.55}
  .reason{color:var(--dim);font-size:12px;max-width:340px}

  .empty{padding:28px 16px;text-align:center;color:var(--dim);font-size:13px}
  .tv{height:420px;background:var(--panel-2)}
  .picker{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
  .picker button{
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    font:600 12px/1 var(--mono);padding:7px 11px;border-radius:6px;cursor:pointer;
  }
  .picker button:hover{color:var(--text);border-color:var(--dim)}
  .picker button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}

  footer{color:var(--dim);font-size:12px;text-align:center;margin-top:24px;line-height:1.7}

  @media(max-width:640px){
    .wrap{padding:14px 10px}
    th,td{padding:8px 11px}
    .stat .v{font-size:19px}
    #equity{height:220px}
    .tv{height:340px}
    .reason{max-width:160px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Trading Desk</h1>
    <span class="stamp" id="stamp"></span>
  </header>

  <div id="alerts"></div>
  <div class="stats" id="stats"></div>

  <section>
    <h2>Equity <span class="note" id="equity-note"></span></h2>
    <div id="equity"></div>
  </section>

  <section>
    <h2>Market chart</h2>
    <div class="picker" id="picker"></div>
    <div class="tv" id="tv"></div>
  </section>

  <section>
    <h2>Open positions</h2>
    <div id="positions"></div>
  </section>

  <section>
    <h2>Latest signals <span class="note" id="signal-note"></span></h2>
    <div class="scroll" id="signals"></div>
  </section>

  <section>
    <h2>Order history</h2>
    <div class="scroll" id="trades"></div>
  </section>

  <section>
    <h2>Model accuracy <span class="note" id="accuracy-note"></span></h2>
    <div class="scroll" id="accuracy"></div>
  </section>

  <section>
    <h2>Probability calibration <span class="note" id="calibration-note"></span></h2>
    <div class="body" id="calibration"></div>
  </section>

  <section>
    <h2>Backtest reality check <span class="note">every window, not the best one</span></h2>
    <div class="scroll" id="backtests"></div>
  </section>

  <footer>
    Paper trading. Charts by TradingView Lightweight Charts.<br>
    Rebuilt by <code>scripts/build_dashboard.py</code> after each daily run.
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const money = n => (n==null||isNaN(n)) ? '--' : '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct   = n => (n==null||isNaN(n)) ? '--' : (Number(n)*100).toFixed(1)+'%';
const esc   = s => String(s??'').replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const signClass = n => n==null ? '' : (n>0?'up':n<0?'down':'muted');

const EXPOSURE_CAP = 0.30;   // risk_config.PortfolioRiskConfig.max_portfolio_exposure

function table(cols, rows, emptyMsg){
  if(!rows.length) return `<div class="empty">${esc(emptyMsg)}</div>`;
  return `<table><thead><tr>${cols.map(c=>`<th${c.num?' style="text-align:right"':''}>${esc(c.label)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.num?'num':''} ${c.cls||''}">${c.get(r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

/* Anything that stops the bot trading gets said out loud, at the top.
   The account went four months without opening a position and the only
   evidence was one line buried in a CI log. */
function renderAlerts(d){
  const out = [];
  const run = d.latest_run || {};
  const acct = run.account || {};

  if(acct.exposure != null && acct.exposure >= EXPOSURE_CAP){
    out.push({crit:true, h:'Exposure cap reached — every buy is being rejected',
      p:`Invested ${pct(acct.exposure)} against a ${pct(EXPOSURE_CAP)} cap. New entries stay blocked until a position is trimmed or an exit fires.`});
  }
  if(run.eos_available === false){
    out.push({crit:false, h:'Running on reduced built-in logic',
      p:'The eos finance algorithms did not load, so this run is <em>not</em> the configuration the backtests were validated under.'});
  }
  if(run.orders_submitted === 0 && (run.signals||[]).some(s=>s.decision==='PASS')){
    const passed = run.signals.filter(s=>s.decision==='PASS').map(s=>s.symbol).join(', ');
    out.push({crit:false, h:'Signals passed but no orders were submitted',
      p:`<code>${esc(passed)}</code> cleared the confidence and probability thresholds, yet nothing reached the broker.`});
  }

  $('alerts').innerHTML = out.map(a=>
    `<div class="alert ${a.crit?'crit':''}"><div>${a.crit?'&#9888;':'&#9432;'}</div><div><h3>${a.h}</h3><p>${a.p}</p></div></div>`
  ).join('');
}

function renderStats(d){
  const run = d.latest_run || {}, acct = run.account || {}, s = d.summary || {};
  const curve = d.equity_curve || [];
  const last = curve[curve.length-1];
  const exposure = acct.exposure ?? last?.exposure ?? 0;
  const over = exposure >= EXPOSURE_CAP;
  const dayRet = last?.daily_return;

  $('stats').innerHTML = `
    <div class="stat"><div class="k">Equity</div>
      <div class="v">${money(acct.equity ?? last?.value)}</div>
      <div class="sub ${signClass(dayRet)}">${dayRet!=null?(dayRet>=0?'+':'')+(dayRet*100).toFixed(2)+'% today':'&nbsp;'}</div></div>

    <div class="stat"><div class="k">Exposure</div>
      <div class="v ${over?'down':''}">${pct(exposure)}</div>
      <div class="gauge"><i class="${over?'over':''}" style="width:${Math.min(100,exposure*100/0.5).toFixed(0)}%"></i><span class="cap" style="left:${(EXPOSURE_CAP*100/0.5).toFixed(0)}%"></span></div>
      <div class="sub">${pct(EXPOSURE_CAP)} cap</div></div>

    <div class="stat"><div class="k">Cash</div>
      <div class="v">${money(acct.cash)}</div>
      <div class="sub">uninvested</div></div>

    <div class="stat"><div class="k">Realized P&amp;L</div>
      <div class="v ${signClass(s.realized_pnl)}">${money(s.realized_pnl)}</div>
      <div class="sub">${s.closed||0} closed &middot; ${s.win_rate!=null?s.win_rate+'% win':'no data'}</div></div>

    <div class="stat"><div class="k">Orders filled</div>
      <div class="v">${s.filled ?? 0}</div>
      <div class="sub ${s.failed?'down':''}">${s.failed||0} failed</div></div>

    <div class="stat"><div class="k">Models</div>
      <div class="v ${run.eos_available?'up':'warn'}" style="font-size:16px">${run.eos_available?'FULL':'REDUCED'}</div>
      <div class="sub">${run.eos_available?'eos algorithms loaded':'built-in logic only'}</div></div>`;
}

function renderEquity(d){
  const data = (d.equity_curve||[]).map(p=>({time:p.time, value:p.value}));
  $('equity-note').textContent = data.length ? `${data.length} sessions` : '';
  if(!data.length){ $('equity').innerHTML = '<div class="empty">No snapshots recorded yet.</div>'; return; }

  const chart = LightweightCharts.createChart($('equity'), {
    layout:{background:{color:'transparent'}, textColor:'#8b95a9', fontSize:11},
    grid:{vertLines:{color:'rgba(36,44,61,.5)'}, horzLines:{color:'rgba(36,44,61,.5)'}},
    rightPriceScale:{borderColor:'#242c3d'},
    timeScale:{borderColor:'#242c3d', fixLeftEdge:true, fixRightEdge:true},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    handleScale:false, handleScroll:false,
  });
  const series = chart.addAreaSeries({
    lineColor:'#4c8dff', topColor:'rgba(76,141,255,.28)', bottomColor:'rgba(76,141,255,0)',
    lineWidth:2, priceFormat:{type:'price', precision:2, minMove:0.01},
  });
  series.setData(data);
  chart.timeScale().fitContent();
  new ResizeObserver(()=>chart.applyOptions({width:$('equity').clientWidth})).observe($('equity'));
}

function renderPositions(d){
  const rows = d.latest_run?.positions || [];
  $('positions').innerHTML = table([
    {label:'Symbol', get:r=>`<span class="sym">${esc(r.symbol)}</span>`},
    {label:'Qty', num:true, get:r=>r.qty},
    {label:'Entry', num:true, get:r=>money(r.entry)},
    {label:'Held since', num:true, get:r=>`<span class="muted">${esc(r.since)}</span>`},
  ], rows, 'No open positions.');
}

function renderSignals(d){
  const rows = d.latest_run?.signals || [];
  const passed = rows.filter(r=>r.decision==='PASS').length;
  $('signal-note').textContent = d.latest_run?.date ? `${d.latest_run.date} · ${passed} passed of ${rows.length}` : '';
  // Actionable signals first — a wall of HOLDs buries the two that matter.
  const order = {PASS:0, REJECT:1, HOLD:2};
  rows.sort((a,b)=>(order[a.decision]??3)-(order[b.decision]??3) || b.confidence-a.confidence);

  $('signals').innerHTML = table([
    {label:'Symbol', get:r=>`<span class="sym">${esc(r.symbol)}</span>`},
    {label:'Signal', get:r=>`<span class="tag t-${(r.signal||'hold').toLowerCase()}">${esc(r.signal||'HOLD')}</span>`},
    {label:'Conf', num:true, get:r=>`${(r.confidence*100).toFixed(0)}%<span class="bar" style="width:${(r.confidence*32).toFixed(0)}px"></span>`},
    {label:'P(up)', num:true, get:r=>`${(r.prob_profit*100).toFixed(0)}%`},
    {label:'Decision', get:r=>`<span class="tag t-${(r.decision||'hold').toLowerCase()}">${esc(r.decision||'—')}</span>`},
    {label:'Reason', cls:'reason', get:r=>esc(r.reason)},
  ], rows, 'No signals in the latest run.');
}

function renderTrades(d){
  $('trades').innerHTML = table([
    {label:'Symbol', get:r=>`<span class="sym">${esc(r.symbol)}</span>`},
    {label:'Side', get:r=>`<span class="tag t-${esc(r.side)}">${esc((r.side||'').toUpperCase())}</span>`},
    {label:'Qty', num:true, get:r=>r.qty},
    {label:'Entry', num:true, get:r=>money(r.entry)},
    {label:'Exit', num:true, get:r=>money(r.exit)},
    {label:'P&L', num:true, get:r=>`<span class="${signClass(r.pnl)}">${r.pnl==null?'--':money(r.pnl)}</span>`},
    {label:'Status', get:r=>`<span class="tag t-${(r.status||'').toLowerCase()}">${esc(r.status)}</span>`},
    {label:'Detail', cls:'reason', get:r=>esc(r.error || r.opened_at?.slice(0,10) || '')},
  ], d.trades||[], 'No orders recorded yet.');
}

function renderBacktests(d){
  const rows = (d.backtests||[]).filter(b=>b.n_trades).sort((a,b)=>(b.n_trades||0)-(a.n_trades||0)).slice(0,12);
  $('backtests').innerHTML = table([
    {label:'Window', get:r=>`<span class="sym">${esc(r.name.replace('backtest_',''))}</span>`},
    {label:'Trades', num:true, get:r=>r.n_trades},
    {label:'Win %', num:true, get:r=>r.win_rate?.toFixed(1) ?? '--'},
    {label:'Return', num:true, get:r=>`<span class="${signClass(r.total_return_pct)}">${r.total_return_pct?.toFixed(2) ?? '--'}%</span>`},
    // The comparison that matters: beating zero is not beating the alternative.
    {label:'Buy & hold', num:true, get:r=>`<span class="muted">${r.buy_hold_return_pct?.toFixed(2) ?? '--'}%</span>`},
    {label:'Sharpe', num:true, get:r=>`<span class="${signClass(r.sharpe)}">${r.sharpe?.toFixed(2) ?? '--'}</span>`},
    {label:'95% CI', num:true, get:r=>r.ci95 ? `<span class="${r.ci95[0]>0?'up':'warn'}">[${r.ci95[0].toFixed(2)}, ${r.ci95[1].toFixed(2)}]</span>` : '--'},
  ], rows, 'No backtests found.');
}

/* Measured directional accuracy per component, judged against the base rate
   rather than against 50%. In a tape that rose 76% of the time, a component
   scoring 58% is not skilled — it is worse than always guessing up. */
function renderAccuracy(d){
  const a = d.component_accuracy || {};
  const rows = a.components || [];
  if(!rows.length){
    $('accuracy').innerHTML = '<div class="empty">Nothing scored yet — predictions are graded the day after they are made.</div>';
    return;
  }
  const base = a.base_rate;
  $('accuracy-note').textContent = `${a.base_n} scored · market rose ${base}% of the time`;

  const verdict = r => {
    if(r.ci_high < 50) return ['down','worse than chance'];
    if(r.ci_low > base) return ['up','beats the base rate'];
    if(r.ci_low > 50)   return ['warn','beats 50% but not the base rate'];
    return ['muted','indistinguishable from chance'];
  };

  $('accuracy').innerHTML = table([
    {label:'Component', get:r=>`<span class="sym">${esc(r.name)}</span>`},
    {label:'N', num:true, get:r=>r.n},
    {label:'Accuracy', num:true, get:r=>{const [c]=verdict(r); return `<span class="${c}">${r.accuracy}%</span>`;}},
    {label:'95% CI', num:true, get:r=>`<span class="muted">[${r.ci_low}%, ${r.ci_high}%]</span>`},
    {label:'vs base rate', num:true, get:r=>{
      const diff = (r.accuracy - base).toFixed(1);
      return `<span class="${r.accuracy>base?'up':'down'}">${diff>0?'+':''}${diff}pp</span>`;
    }},
    {label:'Verdict', cls:'reason', get:r=>{const [c,t]=verdict(r); return `<span class="${c}">${t}</span>`;}},
  ], rows, '');
}

/* Whether the claimed prob_profit has been corrected against reality yet, and
   — the direct answer to "when should I check back on this" — a projected
   date for a sample large enough to trust, based on the pace predictions have
   actually accrued so far. Not a promise, a projection from observed pace. */
function renderCalibration(d){
  const c = d.calibration || {};
  const el = $('calibration');

  if(!c.fitted){
    const need = c.min_sample ?? 30, have = c.scored_n ?? 0;
    const pct = Math.min(100, (have/need*100)).toFixed(0);
    el.innerHTML = `
      <p class="muted" style="margin:0 0 10px">Not enough scored predictions yet to correct the model's claimed
      probabilities — using raw values until then.</p>
      <div class="gauge" style="height:6px"><i style="width:${pct}%"></i></div>
      <p class="muted" style="margin:8px 0 0;font-size:12px">${have} of ${need} needed</p>`;
    $('calibration-note').textContent = `${have}/${need} to activate`;
    return;
  }

  $('calibration-note').textContent = `fit on n=${c.n} · ${(c.fitted_at||'').slice(0,10)}`;

  const readyBlock = c.target_ready_date ? `
    <div class="stat" style="margin-top:12px">
      <div class="k">Meaningful sample (n=${c.target_sample ?? 300}) expected</div>
      <div class="v" style="font-size:17px">${esc(c.target_ready_date)}</div>
      <div class="sub">at ${c.predictions_per_run_day ?? '?'} scored predictions per run-day — check back around then</div>
    </div>` : '';

  // A curve that stays flat near the base rate regardless of the claim is
  // itself the finding: the model's confidence carries no information beyond
  // "the market usually goes up." Flag that in plain language rather than
  // just plotting it and hoping it's noticed.
  const ys = (c.curve||[]).map(p=>p[1]);
  const spread = ys.length ? Math.max(...ys)-Math.min(...ys) : 0;
  const flatWarning = (c.curve||[]).length && spread < 0.08 ? `
    <div class="alert" style="margin-top:12px"><div>&#9432;</div><div>
      <h3>The curve is nearly flat</h3>
      <p>Calibrated output stays within ${(spread*100).toFixed(1)} points regardless of what the model claims —
      its confidence currently carries almost no information beyond the base rate itself.</p>
    </div></div>` : '';

  el.innerHTML = `
    <div class="scroll"><table><thead><tr><th>Model claims</th><th style="text-align:right">Empirically becomes</th></tr></thead><tbody>
      ${(c.curve||[]).map(([x,y])=>`<tr><td class="num">${(x*100).toFixed(1)}%</td><td class="num">${(y*100).toFixed(1)}%</td></tr>`).join('')}
    </tbody></table></div>
    ${readyBlock}${flatWarning}`;
}

/* Real market charts, straight from TradingView, for whatever the bot holds
   or flagged today. */
function renderTV(d){
  const held = (d.latest_run?.positions||[]).map(p=>p.symbol);
  const flagged = (d.latest_run?.signals||[]).filter(s=>s.decision==='PASS').map(s=>s.symbol);
  const symbols = [...new Set([...held, ...flagged, 'SPY'])].slice(0,8);

  $('picker').innerHTML = symbols.map((s,i)=>
    `<button data-sym="${esc(s)}" aria-pressed="${i===0}">${esc(s)}</button>`).join('');

  const load = sym => {
    $('tv').innerHTML = '';
    const w = document.createElement('div');
    w.className = 'tradingview-widget-container';
    w.style.height = '100%';
    const inner = document.createElement('div');
    inner.style.height = '100%';
    w.appendChild(inner);
    const s = document.createElement('script');
    s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
    s.async = true;
    s.innerHTML = JSON.stringify({
      symbol: sym, interval:'D', timezone:'America/New_York', theme:'dark',
      style:'1', locale:'en', hide_side_toolbar:true, allow_symbol_change:false,
      save_image:false, autosize:true, backgroundColor:'rgba(19,24,36,1)',
      gridColor:'rgba(36,44,61,0.5)',
    });
    w.appendChild(s);
    $('tv').appendChild(w);
  };

  $('picker').addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    [...$('picker').children].forEach(b=>b.setAttribute('aria-pressed', b===btn));
    load(btn.dataset.sym);
  });
  if(symbols.length) load(symbols[0]);
}

fetch('data.json?t='+Date.now())
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d=>{
    $('stamp').textContent = 'built ' + (d.generated_at||'').replace('T',' ').replace('+00:00',' UTC');
    renderAlerts(d); renderStats(d); renderEquity(d);
    renderPositions(d); renderSignals(d); renderTrades(d);
    renderAccuracy(d); renderCalibration(d); renderBacktests(d); renderTV(d);
  })
  .catch(e=>{
    $('alerts').innerHTML = `<div class="alert crit"><div>&#9888;</div><div>
      <h3>Could not load data.json</h3>
      <p>${esc(e.message)} — run <code>python scripts/build_dashboard.py</code>, and serve this folder over HTTP rather than opening the file directly.</p>
    </div></div>`;
  });
</script>
</body>
</html>
