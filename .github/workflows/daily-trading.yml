name: Daily Trading Run

on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log decisions without submitting orders"
        type: boolean
        default: true
      universe_scope:
        description: "equities | commodities | agriculture | energy | metals | all"
        type: string
        default: "all"

permissions:
  contents: write

concurrency:
  group: daily-trading
  cancel-in-progress: false

jobs:
  run-daily-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      CI: "true"
      GITHUB_ACTIONS: "true"
      # Accept either naming. `||` in a GitHub expression yields the first
      # non-empty value, so ALPACA_* wins if present and API_KEY/SECRET_KEY
      # (matching the local .env convention) works as the fallback. Without
      # this, a secret stored under the other name reads as an empty string
      # and the run looks exactly like having no credentials at all.
      API_KEY: ${{ secrets.ALPACA_API_KEY || secrets.API_KEY }}
      SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.SECRET_KEY }}
      APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY || secrets.API_KEY }}
      APCA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure output folders exist
        run: |
          mkdir -p trade_logs
          mkdir -p artifacts

      # Without this the run still "succeeds": missing credentials make
      # create_broker_client fall back to an in-memory broker, the bot trades a
      # fake book, and nothing reaches Alpaca. Fail here instead, with an
      # actionable message, before wasting three minutes on signals.
      - name: Verify Alpaca credentials are present
        run: |
          if [ -z "${APCA_API_KEY_ID}" ] || [ -z "${APCA_API_SECRET_KEY}" ]; then
            echo "::error title=Missing Alpaca credentials::No Alpaca credentials found. Set repository secrets named either ALPACA_API_KEY/ALPACA_SECRET_KEY or API_KEY/SECRET_KEY under Settings > Secrets and variables > Actions. Without them this run would trade an in-memory fake broker and never reach Alpaca."
            exit 1
          fi
          echo "Alpaca credentials present (key ends ...${APCA_API_KEY_ID: -4})."

      # The finance algorithms live in a sibling repo. Without this step
      # logic/eos_bridge.py cannot import them, EOS_AVAILABLE stays False, and
      # the bot trades on reduced built-in logic while every local backtest runs
      # WITH the algorithms -- a silent backtest/production mismatch that made
      # months of validated results describe a strategy that never executed.
      - name: Fetch eos finance algorithms
        id: eos
        env:
          EOS_REPO_TOKEN: ${{ secrets.EOS_REPO_TOKEN }}
        run: |
          REPO="https://github.com/Quintinlf/My_folder.git"
          if [ -n "${EOS_REPO_TOKEN}" ]; then
            REPO="https://x-access-token:${EOS_REPO_TOKEN}@github.com/Quintinlf/My_folder.git"
          fi
          if git clone --depth 1 --filter=blob:none --sparse "$REPO" "${RUNNER_TEMP}/eos" 2>/dev/null; then
            git -C "${RUNNER_TEMP}/eos" sparse-checkout set mcp_server
            if [ -d "${RUNNER_TEMP}/eos/mcp_server" ]; then
              echo "EOS_ROOT=${RUNNER_TEMP}/eos/mcp_server" >> "$GITHUB_ENV"
              echo "eos algorithms available at ${RUNNER_TEMP}/eos/mcp_server"
              exit 0
            fi
          fi
          echo "::warning title=eos algorithms unavailable::Could not fetch the mcp_server checkout, so the run falls back to built-in logic only. This is NOT the configuration your backtests were validated under. Add an EOS_REPO_TOKEN secret with read access to Quintinlf/My_folder."

      - name: Execute daily trading entrypoint
        env:
          EXECUTION_MODE: "paper"
          # Scheduled runs trade; a manual run defaults to dry so the first
          # verification of a new credential set proves the connection without
          # submitting anything.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          MIN_CONF: "0.50"
          MIN_PROB_UP: "0.50"
          TP_PCT: "0.04"
          SL_PCT: "0.02"
          BASE_RISK_PCT: "2.0"
          UNIVERSE_SCOPE: ${{ inputs.universe_scope || 'all' }}
          INVERSE_ROUTING: "true"
          # Refuse the silent in-memory fallback: a fake fill in CI is worse
          # than a failed job, because it looks like success.
          STRICT_BROKER: "true"
        run: |
          set -o pipefail
          python run_daily_bot.py 2>&1 | tee trade_logs/run-$(date -u +'%Y%m%d').log

      # Refreshes docs/data.json, which the commit step below pushes. GitHub
      # Pages serves docs/ straight off the branch (Settings > Pages > Deploy
      # from a branch > main > /docs), so no separate deploy job is needed.
      - name: Build dashboard data
        if: always()
        run: python scripts/build_dashboard.py

      # A run that silently does nothing looks identical to a run with nothing
      # to do. This is the step that tells them apart without opening a log.
      # No-ops until the channel secrets exist, so it is safe to land now.
      - name: Push run summary
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python scripts/notify_run.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-trading-artifacts
          path: |
            trade_logs/
            learned_params.json
          if-no-files-found: warn

      - name: Summarise the run
        if: always()
        run: |
          LOG=$(ls -t trade_logs/run-*.log 2>/dev/null | head -1)
          {
            echo "## Daily trading run"
            echo ""
            if [ -z "$LOG" ]; then
              echo "No run log produced - the bot did not get far enough to write one."
              exit 0
            fi
            echo '```'
            grep -E "EOS FINANCE DOMAINS|ACCOUNT:|UNIVERSE SCREEN|TRADING UNIVERSE|SIGNALS GENERATED|INVERSE ROUTING|ORDERS ATTEMPTED|ORDERS SUBMITTED|Decision summary|ORDER REJECTED|ORDER NOT SUBMITTED|BROKER CONNECTION FAILED" "$LOG" | sed 's/^[0-9-]* [0-9:,]* | [A-Z]* | //' || echo "(no summary lines matched)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push updated trade logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add each path on its own. Listing them in one `git add` meant a
          # single missing file (learned_params.json never exists) failed the
          # whole command, `|| true` swallowed it, and nothing was ever staged
          # - which is why the database never persisted between runs and every
          # run started from an empty history.
          #
          # trade_logs/*.json, trade_logs/backtests/*.json, and
          # trade_logs/theses/*.jsonl were missing from this list entirely:
          # calibration.json (refit every run by logic/calibration.py) was
          # never re-staged after the one time it was committed by hand, and
          # backtests/ + theses/ - 17 and 6 files respectively - had NEVER been
          # committed at all. A fresh clone of this repo would be missing all
          # of it; only the machine that generated them locally had them.
          for path in trade_logs/*.csv trade_logs/*.db trade_logs/*.jsonl trade_logs/*.json \
                      trade_logs/backtests/*.json trade_logs/theses/*.jsonl \
                      trade_logs/*.log docs/data.json learned_params.json; do
            if compgen -G "$path" > /dev/null; then
              git add -f $path && echo "staged: $path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No log changes to commit."
            exit 0
          fi

          git commit -m "Daily automated trading run ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Another run may have pushed since checkout; rebase rather than fail.
          git pull --rebase --autostash origin main || true
          git push
