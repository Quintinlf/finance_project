name: Daily Trading Run

on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-trading
  cancel-in-progress: false

jobs:
  run-daily-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      CI: "true"
      GITHUB_ACTIONS: "true"
      API_KEY: ${{ secrets['ALPACA_API_KEY'] }}
      SECRET_KEY: ${{ secrets['ALPACA_SECRET_KEY'] }}
      APCA_API_KEY_ID: ${{ secrets['ALPACA_API_KEY'] }}
      APCA_API_SECRET_KEY: ${{ secrets['ALPACA_SECRET_KEY'] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure output folders exist
        run: |
          mkdir -p trade_logs
          mkdir -p artifacts

      # Without this the run still "succeeds": missing credentials make
      # create_broker_client fall back to an in-memory broker, the bot trades a
      # fake book, and nothing reaches Alpaca. Fail here instead, with an
      # actionable message, before wasting three minutes on signals.
      - name: Verify Alpaca credentials are present
        run: |
          if [ -z "${APCA_API_KEY_ID}" ] || [ -z "${APCA_API_SECRET_KEY}" ]; then
            echo "::error title=Missing Alpaca credentials::Repository secrets ALPACA_API_KEY and/or ALPACA_SECRET_KEY are not set, so this run would trade an in-memory fake broker and reach Alpaca never. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Alpaca credentials present (key ends ...${APCA_API_KEY_ID: -4})."

      - name: Execute daily trading entrypoint
        env:
          EXECUTION_MODE: "paper"
          DRY_RUN: "false"
          MIN_CONF: "0.50"
          MIN_PROB_UP: "0.50"
          TP_PCT: "0.04"
          SL_PCT: "0.02"
          BASE_RISK_PCT: "2.0"
          UNIVERSE_SCOPE: "all"
          INVERSE_ROUTING: "true"
          # Refuse the silent in-memory fallback: a fake fill in CI is worse
          # than a failed job, because it looks like success.
          STRICT_BROKER: "true"
        run: |
          set -o pipefail
          python run_daily_bot.py 2>&1 | tee trade_logs/run-$(date -u +'%Y%m%d').log

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-trading-artifacts
          path: |
            trade_logs/
            learned_params.json
          if-no-files-found: warn

      - name: Summarise the run
        if: always()
        run: |
          LOG=$(ls -t trade_logs/run-*.log 2>/dev/null | head -1)
          {
            echo "## Daily trading run"
            echo ""
            if [ -z "$LOG" ]; then
              echo "No run log produced - the bot did not get far enough to write one."
              exit 0
            fi
            echo '```'
            grep -E "ACCOUNT:|UNIVERSE SCREEN|TRADING UNIVERSE|SIGNALS GENERATED|INVERSE ROUTING|ORDERS ATTEMPTED|ORDERS SUBMITTED|Decision summary|ORDER REJECTED|ORDER NOT SUBMITTED|BROKER CONNECTION FAILED" "$LOG" | sed 's/^[0-9-]* [0-9:,]* | [A-Z]* | //' || echo "(no summary lines matched)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push updated trade logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add each path on its own. Listing them in one `git add` meant a
          # single missing file (learned_params.json never exists) failed the
          # whole command, `|| true` swallowed it, and nothing was ever staged
          # - which is why the database never persisted between runs and every
          # run started from an empty history.
          for path in trade_logs/*.csv trade_logs/*.db trade_logs/*.jsonl trade_logs/*.log learned_params.json; do
            if compgen -G "$path" > /dev/null; then
              git add -f $path && echo "staged: $path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No log changes to commit."
            exit 0
          fi

          git commit -m "Daily automated trading run ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Another run may have pushed since checkout; rebase rather than fail.
          git pull --rebase --autostash origin main || true
          git push
